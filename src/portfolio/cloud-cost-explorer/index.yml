layout: portfolio-case.njk
order: 1
title: Cloud Cost Explorer

heading: Cloud Cost Explorer
description: 'Helps to understand spending on cloud tools: observe trends, make predictions, and optimize cost'
role: '**Product UX Designer**'
focus: 'UX end-to-end'
area: 'Work with **Product Owner**, and with **frontend and backend leads** to align UX decisions with real data logic and implementation constraints'
tags:
  - Data-heavy
  - Data visualization
  - NDA
cover_imgs:
  - cover.png

hero:
  image: hero.svg
  picture_tone: bg-secondary
  image_alt: Abstract blurred product dashboard screenshot
  lead: 'Helps to understand spending on cloud tools: observe trends, make predictions, and optimize cost'
theme: cost-explorer

sections:
  - eyebrow: Preparation
    heading: Success criteria
    lead: Before design work, I aligned stakeholders on success criteria for the first release
    decor:
      - type: content-bottom-fill
        image: line-chart.svg
        width: 1320
        height: 330
    content:
      - type: content-list
        ordered: true
        columns: 2
        items:
          - text: "Stakeholders can reliably answer core questions: where money goes, what changed, and why it looks suspicious"
          - text: "MVP is connected to real cloud data in a fintech environment and works end-to-end"
          - text: "Finance considers numbers consistent enough for reporting and budget conversations"
          - text: "Readability holds when group counts and filters grow"

  - eyebrow: Discovery
    heading: Target audience
    lead: |
      Enterprise companies (mostly fintech) with a large multi-cloud footprint.

      They need visibility into cloud spend and usage across many teams, services, and accounts
    content_columns: 2
    decor:
      - type: content-bottom-right
        image: summary.png
        width: 732
        height: 510
      - type: bg-bottom-fill
        image: area-chart.svg
        width: 1400
        height: 380
    content:
      - type: content-text
        heading: Finance / FinOps stakeholders
        content: |
          - accountable for cloud spend
          - need to explain variances and allocate costs across teams/projects
      - type: content-text
        heading: Engineering leads
        content: |
          - need to understand what drives usage and cost in their area
          - need to spot anomalies early and plan budgets with confidence

  - eyebrow: Discovery
    heading: Problem context
    lead: "To keep the work grounded, I framed design around representative tasks: real questions users need to answer."
    content:
      - type: content-list
        heading: Pain points
        ordered: true
        columns: 3
        items:
          - No single source of truth for cloud cost and usage
          - Existing internal tools are limited and hard to use
          - Too much data gets buried without strong organization

      - type: table
        heading: Representative tasks
        layout: blocks
        columns:
          - key: question
            heading: Question
          - key: cluster
            heading: Cluster
        rows:
          - question: Cloud spend keeps growing and is close to our budget limit - what is driving it?
            cluster:
              text: Understand
              tone: amber
          - question: Spend jumped unexpectedly - what changed and what caused it?
            cluster:
              text: Investigate
              tone: emerald
          - question: Where can we cut cloud costs with minimal risk and what is the expected impact?
            cluster:
              text: Optimise
              tone: sky
          - question: I see recurring spikes over a few days - what correlates with them?
            cluster:
              text: Understand
              tone: amber
          - question: If the trend continues, when do we exceed budget and what is the end-of-period forecast?
            cluster:
              text: Predict
              tone: emerald

      - type: content-list
        heading: Constraints
        ordered: true
        columns: 3
        items:
          - Very limited access to users and competitor products
          - Data-heavy UI with dense tables and many dimensions
          - "Complex domain: FinOps, chargeback, forecasting, governance"

