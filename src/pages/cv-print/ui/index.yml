experience:
  heading: Experience
  dutiesHeading: Duties
  achievementHeading: Achievements
  projectsHeading: Project examples
  list:
    - companyName: CloudTech
      position: UI / UX Designer
      dates: August 2021 – Present
      shortDescription: CloudTech delivers cloud management, planning and BI dashboard solutions for fintech and multicloud B2B environments
      achievements:
        - heading: Designed 100+ screens for dashboards, analytics, and cloud management tools using a responsive approach in Figma auto layout — including adaptation for TV displays.
        - heading: Improved UI consistency with unified typography, a tokenized spacing scale, and reusable layout patterns.
        - heading: Migrated ~50 screens to the client’s design system in 2 months, achieving 100% component coverage and 0 defects in client-side review.
        - heading: Built a component library adopted 100% across new interfaces. Included 100+ tokens and 52 components. Reduced frontend complexity and improved delivery speed by ~25% in story points.
        - heading: Co-created the multicloud cost analytics platform alongside the product owner, benchmarking 7 leading tools (by Azure, AWS, Harness, and others). Created advanced BI dashboards and a database management service.
        - heading: Authored comprehensive documentation and developer-handoff specs as a "single source of truth" — lauded by engineers as "the best docs" they've ever used.
        - heading: Took the initiative to integrate mock versioning and issue-linked release notes into the Agile process, leading to clearer testing workflows and more predictable feature delivery.
        - heading: Applied iterative design in sprints — refining UI through dev feedback, testing, and real usage insights.
    - companyName: HTML Academy
      position: Author, Mentor
      dates: October 2019 – July 2023
      shortDescription: A school with a deep specialization in frontend development, focused on teaching students from scratch
      achievements:
        - heading: Mentored 50+ students across 15 intensives, supporting them one-on-one. 61% gave the mentorship a perfect 10/10, and 64% of all course cases ended with a successful final project defense, which is above the average.
        - heading: |
            Wrote 9 students' book chapters and 2 blog posts, plus 30+ screencasts with step-by-step guidelines and reference solutions — all used in the core learning track.

            Presented internal lectures and gave a public YouTube lesson on Figma.
        - heading: Took a leadership role in mentoring — helping demotivated students regain confidence and motivation, so they could return to learning and get through the hardest parts of the course.
        - heading: Co-authored the "Design for Frontend Developers" course, developing its structure, content, and tests.
    - companyName: Freelance
      position: Designer, Frontend Developer
      dates: June 2019 – August 2021
      shortDescription: Developed websites for clients in industrial equipment, automation, security, consulting, and e-commerce.
      achievements:
        - heading: Covered the full design lifecycle — from research and wireframes to UI, implementation, and launch.
        - heading: Delivered high-performance frontends with a11y compliance and 85–95 scores in Google PageSpeed Insights.
    - companyName: United Design Studio
      position: Developer, Co-founder
      dates: June 2011 – June 2019
      shortDescription: Small design studio focused on web development and branding, engaging with the local design community.
      achievements:
        - heading: Implemented the Zurb Foundation UI library, reducing layout time by ~30% across 20+ projects.
        - heading: Built a template engine for tender presentations, saving ~1–3 hours per each.
