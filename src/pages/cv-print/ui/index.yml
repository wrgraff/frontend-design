paperHeader:
  name: Artur Trifonov
  position: Senior UI Designer
  about: |
    14 years of experience in UI, including 4 in fintech, cloud platforms, and B2B tools. Designed 100+ responsive screens (dashboards, planning tools) with auto layout. Improved visual consistency through unified typography, tokenized spacing, and reusable patterns. Authored clear, self-documented components that made collaboration with engineers more effective.

    Focused on structure, empathy, and clarity. Acts as the user’s advocate in product discussions.
    Mentored 50+ students, co-authored the "Design for Devs" course, and delivered lectures. Ready to bring foundational rigor and a systematic approach to design.
