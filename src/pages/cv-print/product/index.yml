paperHeader:
  name: Artur Trifonov
  position: Product Designer
  about: |
    14 years in UI, including 4 in fintech and B2B platforms as part of cross-functional product teams. Took the lead on design for complex tools — from cost analytics to infrastructure planning — aligning user needs with product goals. Values autonomy and brings a growth mindset — curious to learn, eager to improve, and happy to support others in growing too.

    Focused on structure, empathy, and clarity. Acts as the user’s advocate in product discussions.
    Mentored 50+ students, co-authored the "Design for Devs" course, and delivered lectures. Ready to bring foundational rigor and system thinking to design.
