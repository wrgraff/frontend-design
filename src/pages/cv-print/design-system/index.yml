paperHeader:
  name: Artur Trifonov
  position: Design System Designer
  about: |
    14 years of experience in UI, including 4 in fintech, cloud platforms, and B2B tools. Built and maintained a design system adopted across 100+ screens, with 100+ tokens and 50+ components. Improved development speed by ~25% through reusable patterns, close dev collaboration, and detailed documentation — described by engineers as “the best docs” they’ve ever used.

    Driven by systemic thinking, quality, consistency, and autonomy.
    Mentored 50+ students, co-authored the "Design for Devs" course, and delivered lectures.
    Ready to bring foundational rigor, attention to detail, strong design principles, and a systematic approach.
